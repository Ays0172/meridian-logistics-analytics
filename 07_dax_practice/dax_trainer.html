<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAX Practice Trainer</title>
<style>
:root{
  --bg:#f7f7f4; --fg:#1d2227; --muted:#59636e; --card:#ffffff; --border:#d6dbe0;
  --accent:#1f5fbf; --accent-fg:#ffffff; --ok:#17703a; --ok-bg:#e4f4ea;
  --bad:#b3261e; --bad-bg:#fbe9e7; --warn:#8a5a00; --warn-bg:#fff4d6;
  --info:#31577f; --info-bg:#e6eff8; --code-bg:#eef1f4; --mark:#ffd84d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181c; --fg:#e6e9ec; --muted:#9aa5b1; --card:#1c2228; --border:#35404a;
    --accent:#6ea8ff; --accent-fg:#0b1118; --ok:#6fd195; --ok-bg:#16301f;
    --bad:#ff8f86; --bad-bg:#3a1b19; --warn:#f2c36b; --warn-bg:#3a2e12;
    --info:#8fbbe8; --info-bg:#17283a; --code-bg:#11161a; --mark:#7a6200;
  }
}
:root[data-theme="dark"]{
  --bg:#14181c; --fg:#e6e9ec; --muted:#9aa5b1; --card:#1c2228; --border:#35404a;
  --accent:#6ea8ff; --accent-fg:#0b1118; --ok:#6fd195; --ok-bg:#16301f;
  --bad:#ff8f86; --bad-bg:#3a1b19; --warn:#f2c36b; --warn-bg:#3a2e12;
  --info:#8fbbe8; --info-bg:#17283a; --code-bg:#11161a; --mark:#7a6200;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
button,select,input{font:inherit;color:inherit}
button{min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.lvl[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
select,input[type=number]{min-height:44px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card)}
select{max-width:100%;flex:1 1 200px}
input[type=number]{width:110px}
.badge{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.badge.Beginner{color:var(--ok);border-color:var(--ok)}
.badge.Intermediate{color:var(--info);border-color:var(--info)}
.badge.Pro{color:var(--warn);border-color:var(--warn)}
.prompt{font-size:1.05rem;margin:6px 0 4px}
.meta{color:var(--muted);font-size:.88rem}
textarea{display:block;width:100%;min-height:150px;resize:vertical;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--code-bg);color:var(--fg);font:16px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}
textarea:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
pre{margin:6px 0;padding:10px;background:var(--code-bg);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem}
code{background:var(--code-bg);padding:0 4px;border-radius:4px;font-size:.9em}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:.88rem;width:100%}
th,td{border:1px solid var(--border);padding:4px 8px;text-align:left;white-space:nowrap}
th{background:var(--code-bg)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.miss td{background:var(--bad-bg)}
.banner{border-radius:8px;padding:10px 12px;font-weight:600;margin:0 0 8px}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.note{overflow-wrap:anywhere;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:.93rem}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.info{background:var(--info-bg);color:var(--info)}
.note b.tag{font-size:.78rem;border:1px solid currentColor;border-radius:999px;padding:0 7px;margin-right:6px}
details>summary{cursor:pointer;font-weight:600;min-height:32px}
.tbls{display:grid;gap:12px;margin-top:8px}
.tbls h3{margin:0 0 4px;font-size:.9rem}
#score{color:var(--muted);font-size:.9rem}
#selftest-out{display:none}
body.selftest #selftest-out{display:block;white-space:pre-wrap;font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>DAX Practice Trainer</h1>
  <p class="sub">Random logistics data, one question at a time. Type a DAX measure, press Check, and it is run against the data and compared with a reference measure. Runs entirely in your browser.</p>

  <div class="card">
    <div class="row" role="group" aria-label="Level" id="levels"></div>
    <div class="row" style="margin-top:8px">
      <button id="prev" aria-label="Previous challenge">&larr;</button>
      <select id="picker" aria-label="Challenge"></select>
      <button id="next" aria-label="Next challenge">&rarr;</button>
    </div>
    <div class="row sp" style="margin-top:8px">
      <div class="row">
        <label for="seed" class="meta">Seed</label>
        <input id="seed" type="number" inputmode="numeric" min="0" step="1">
        <button id="newdata">New data</button>
      </div>
      <span id="score"></span>
    </div>
  </div>

  <div class="card" id="promptCard"></div>

  <div class="card">
    <details id="preview">
      <summary>Data preview (first rows of each table)</summary>
      <div class="tbls" id="previewBody"></div>
    </details>
  </div>

  <div class="card">
    <label for="editor" class="meta">Your DAX measure (Ctrl+Enter to check)</label>
    <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Total Revenue = SUM(Shipment[Revenue])"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="check" class="primary">Check</button>
      <button id="hint">Show hint</button>
      <button id="answer" disabled title="Make an attempt or open the hint first">Show answer</button>
    </div>
  </div>

  <div class="card" id="result" aria-live="polite" hidden></div>
  <pre id="selftest-out"></pre>
</div>

<script>
"use strict";
/* =====================================================================
   1. Seeded PRNG + random data
   ===================================================================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const TABLES={
  Shipment:{key:'ShipmentID',cols:['ShipmentID','CustomerKey','Mode','Region','Revenue','Cost','Ffe','IsOnTime','DateKey']},
  Customer:{key:'CustomerKey',cols:['CustomerKey','CustomerName','Segment']},
  Date:{key:'DateKey',cols:['DateKey','Date','Year','Month']}
};
const MODES=['Ocean','Air','Road'], REGIONS=['Asia','Europe','Americas'];
const CUST_NAMES=['Northwind Foods','Apex Retail','Blue Harbor Co','Cedar Textiles','Delta Motors','Evergreen Pharma','Falcon Electronics','Granite Tools','Harbor Toys','Iris Home'];

const DATE_ROWS=(function(){
  const rows=[];
  for(let y=2025;y<=2026;y++){
    for(let m=1;m<=12;m++){
      const dim=new Date(Date.UTC(y,m,0)).getUTCDate();
      for(let d=1;d<=dim;d++){
        rows.push({DateKey:y*10000+m*100+d,Date:y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'),Year:y,Month:m});
      }
    }
  }
  return rows;
})();

function buildData(seed,attempt){
  const r=mulberry32((seed*2654435761+attempt*40503+12345)>>>0);
  const ri=(a,b)=>a+Math.floor(r()*(b-a+1));
  const pick=a=>a[Math.floor(r()*a.length)];
  const nCust=8;
  const names=CUST_NAMES.slice().sort(()=>r()-0.5).slice(0,nCust);
  const customers=names.map((nm,i)=>({CustomerKey:i+1,CustomerName:nm,Segment:i<3?'Key':'Standard'}));
  // shuffle segments so Key customers are not always the first keys
  const segs=customers.map(c=>c.Segment).sort(()=>r()-0.5);
  customers.forEach((c,i)=>c.Segment=segs[i]);
  const ships=[];
  for(let i=1;i<=40;i++){
    const u=r(); const mode=u<0.5?'Ocean':(u<0.7?'Air':'Road');
    const rev=mode==='Ocean'?ri(3000,9000):(mode==='Air'?ri(1500,6000):ri(500,3000));
    const cost=Math.round(rev*(0.55+r()*0.42));
    ships.push({ShipmentID:i,CustomerKey:ri(1,nCust),Mode:mode,Region:pick(REGIONS),Revenue:rev,Cost:cost,
      Ffe:mode==='Air'?0:(mode==='Ocean'?ri(1,6):ri(1,2)),IsOnTime:r()<0.75?1:0,DateKey:pick(DATE_ROWS).DateKey});
  }
  return {Shipment:ships,Customer:customers,Date:DATE_ROWS,seed:seed};
}
// derive challenge parameters and reject data that would make a challenge degenerate
function deriveParams(D){
  const S=D.Shipment;
  for(const m of MODES) if(S.filter(s=>s.Mode===m).length<4) return null;
  for(const g of REGIONS) if(S.filter(s=>s.Region===g).length<4) return null;
  if(!S.some(s=>s.Mode==='Air'&&s.Revenue>0)) return null;
  const seg={}; D.Customer.forEach(c=>seg[c.CustomerKey]=c.Segment);
  for(const m of MODES){
    if(!S.some(s=>s.Mode===m&&seg[s.CustomerKey]==='Key')) return null;
    if(!S.some(s=>s.Mode===m&&seg[s.CustomerKey]==='Standard')) return null;
    if(new Set(S.filter(s=>s.Mode===m).map(s=>s.CustomerKey)).size>=D.Customer.length) return null;
  }
  if(new Set(S.map(s=>s.IsOnTime)).size<2) return null;
  // n: customers with more than n shipments
  const cnt={}; S.forEach(s=>cnt[s.CustomerKey]=(cnt[s.CustomerKey]||0)+1);
  const counts=Object.values(cnt);
  let n=null;
  const cands=[...new Set(counts)].sort((a,b)=>a-b);
  for(const c of cands){
    if(counts.some(x=>x===c)&&counts.some(x=>x>c)&&counts.some(x=>x>=1&&x<c)) {n=c;if(c>=4)break;}
  }
  if(n===null) return null;
  // T: shipments with profit above T
  const profits=S.map(s=>s.Revenue-s.Cost).sort((a,b)=>a-b);
  const T=profits[Math.floor(profits.length*0.6)];
  const gt=S.filter(s=>s.Revenue-s.Cost>T).length, ge=S.filter(s=>s.Revenue-s.Cost>=T).length;
  if(gt===ge||gt<2) return null;
  if(S.filter(s=>s.Revenue>T).length===gt) return null;
  // key-customer margin must differ from overall margin
  return {n:n,T:T};
}
function generateData(seed){
  for(let a=0;a<2000;a++){
    const D=buildData(seed,a); const P=deriveParams(D);
    if(P){D.params=P;D.attempt=a;return D;}
  }
  throw new Error('Could not generate valid data for seed '+seed);
}

/* =====================================================================
   2. Tokenizer
   ===================================================================== */
class DaxError extends Error{constructor(msg,pos,len){super(msg);this.pos=(pos==null?-1:pos);this.len=len||1;}}
function tokenize(src){
  const toks=[];let i=0;const n=src.length;
  while(i<n){
    const c=src[i];
    if(/\s/.test(c)){i++;continue;}
    if((c==='/'&&src[i+1]==='/')||(c==='-'&&src[i+1]==='-')){while(i<n&&src[i]!=='\n')i++;continue;}
    if(c==='/'&&src[i+1]==='*'){const e=src.indexOf('*/',i+2);if(e<0)throw new DaxError("This comment started with /* but is never closed with */",i,2);i=e+2;continue;}
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(src[i+1]||''))){
      let j=i;while(j<n&&/[0-9]/.test(src[j]))j++;
      if(src[j]==='.'){j++;while(j<n&&/[0-9]/.test(src[j]))j++;}
      toks.push({type:'num',v:parseFloat(src.slice(i,j)),pos:i,end:j});i=j;continue;
    }
    if(c==='"'){
      let j=i+1,s='';
      for(;;){
        if(j>=n)throw new DaxError('This text string is missing its closing double quote (")',i,1);
        if(src[j]==='"'){if(src[j+1]==='"'){s+='"';j+=2;continue;}break;}
        s+=src[j++];
      }
      toks.push({type:'str',v:s,pos:i,end:j+1});i=j+1;continue;
    }
    if(c==="'"){
      const e=src.indexOf("'",i+1);if(e<0)throw new DaxError("This quoted table name is missing its closing apostrophe (')",i,1);
      toks.push({type:'qid',v:src.slice(i+1,e),pos:i,end:e+1});i=e+1;continue;
    }
    if(c==='['){
      const e=src.indexOf(']',i+1);if(e<0)throw new DaxError("This column/measure name is missing its closing bracket ]",i,1);
      toks.push({type:'br',v:src.slice(i+1,e),pos:i,end:e+1});i=e+1;continue;
    }
    if(/[A-Za-z_]/.test(c)){
      let j=i;while(j<n&&/[A-Za-z0-9_]/.test(src[j]))j++;
      toks.push({type:'id',v:src.slice(i,j),pos:i,end:j});i=j;continue;
    }
    const two=src.slice(i,i+2);
    if(two==='=='||two==='!='||two==='=>')throw new DaxError(two==='!='?"DAX does not use != ; write <> for 'not equal'":"DAX compares with a single = (not "+two+")",i,2);
    if(['<=','>=','<>','&&','||'].includes(two)){toks.push({type:'op',v:two,pos:i,end:i+2});i+=2;continue;}
    if('+-*/=<>&(),{}'.includes(c)){toks.push({type:'op',v:c,pos:i,end:i+1});i++;continue;}
    if(c===';')throw new DaxError('Separate arguments with a comma (,) - semicolons are not accepted here',i,1);
    if(c===':')throw new DaxError("Use = to define a measure (Name = expression), not :=",i,1);
    throw new DaxError("Unexpected character '"+c+"'",i,1);
  }
  toks.push({type:'eof',v:'',pos:n,end:n});
  return toks;
}

/* =====================================================================
   3. Parser (recursive descent) -> AST
   ===================================================================== */
function parseFormula(src){
  let toks=tokenize(src);
  // optional "Measure Name =" prefix
  if(toks[0].type==='id'&&toks[0].v.toUpperCase()!=='VAR'||toks[0].type==='qid'){
    let i=0;
    while(toks[i].type==='id'&&!['VAR','RETURN'].includes(toks[i].v.toUpperCase())||(i===0&&toks[i].type==='qid'))i++;
    if(i>0&&i<=6&&toks[i].type==='op'&&toks[i].v==='=')toks=toks.slice(i+1);
  }
  if(toks.length===1)throw new DaxError('The formula is empty. Write an expression such as SUM(Shipment[Revenue])',0,1);
  let p=0;
  const peek=()=>toks[p], next=()=>toks[p++];
  const isOp=v=>toks[p].type==='op'&&toks[p].v===v;
  const isKw=k=>toks[p].type==='id'&&toks[p].v.toUpperCase()===k;
  const show=t=>t.type==='eof'?'the end of the formula':"'"+src.slice(t.pos,t.end)+"'";
  const fail=(msg,t)=>{t=t||peek();throw new DaxError(msg,t.pos,Math.max(1,t.end-t.pos));};

  function parseExpr(){
    if(isKw('VAR')){
      const vars=[];
      while(isKw('VAR')){
        next();const nt=next();
        if(nt.type!=='id')fail('Expected a variable name after VAR but found '+show(nt),nt);
        if(!isOp('='))fail("Expected '=' after the variable name '"+nt.v+"' but found "+show(peek()));
        next();
        vars.push({name:nt.v,e:parseExpr(),pos:nt.pos});
      }
      if(!isKw('RETURN'))fail('Expected RETURN after the VAR definitions but found '+show(peek()));
      next();
      return {t:'let',vars:vars,body:parseExpr()};
    }
    return parseOr();
  }
  function parseOr(){let l=parseAnd();while(isOp('||')){const o=next();l={t:'bin',op:'||',l:l,r:parseAnd(),pos:o.pos};}return l;}
  function parseAnd(){let l=parseCmp();while(isOp('&&')){const o=next();l={t:'bin',op:'&&',l:l,r:parseCmp(),pos:o.pos};}return l;}
  function parseCmp(){
    let l=parseConcat();
    for(;;){
      const t=peek();
      if(t.type==='op'&&['=','<>','<','>','<=','>='].includes(t.v)){next();l={t:'bin',op:t.v,l:l,r:parseConcat(),pos:t.pos};}
      else if(isKw('IN')){next();l={t:'bin',op:'in',l:l,r:parseConcat(),pos:t.pos};}
      else return l;
    }
  }
  function parseConcat(){let l=parseAdd();while(isOp('&')){const o=next();l={t:'bin',op:'&',l:l,r:parseAdd(),pos:o.pos};}return l;}
  function parseAdd(){let l=parseMul();while(isOp('+')||isOp('-')){const o=next();l={t:'bin',op:o.v,l:l,r:parseMul(),pos:o.pos};}return l;}
  function parseMul(){let l=parseUnary();while(isOp('*')||isOp('/')){const o=next();l={t:'bin',op:o.v,l:l,r:parseUnary(),pos:o.pos};}return l;}
  function parseUnary(){
    if(isOp('-')){const o=next();return {t:'un',op:'-',e:parseUnary(),pos:o.pos};}
    if(isOp('+')){next();return parseUnary();}
    return parsePrimary();
  }
  function parsePrimary(){
    const t=next();
    if(t.type==='num')return {t:'num',v:t.v,pos:t.pos};
    if(t.type==='str')return {t:'str',v:t.v,pos:t.pos};
    if(t.type==='op'&&t.v==='('){
      const e=parseExpr();
      if(!isOp(')')){
        if(peek().type==='eof')fail("Missing ')' - the '(' at position "+(t.pos+1)+" is never closed",peek());
        fail("Expected ')' but found "+show(peek()));
      }
      next();return e;
    }
    if(t.type==='op'&&t.v==='{'){
      const items=[];
      if(!isOp('}')){for(;;){items.push(parseExpr());if(isOp(',')){next();continue;}break;}}
      if(!isOp('}'))fail("Expected '}' to close the list but found "+show(peek()));
      next();return {t:'list',items:items,pos:t.pos};
    }
    if(t.type==='br')return {t:'mref',name:t.v,pos:t.pos,end:t.end};
    if(t.type==='qid'||t.type==='id'){
      if(t.type==='id'&&isOp('(')){
        const open=next();const args=[];
        if(!isOp(')')){
          for(;;){
            args.push(parseExpr());
            if(isOp(',')){next();continue;}
            break;
          }
        }
        if(!isOp(')')){
          if(peek().type==='eof')fail("Missing ')' - the '(' after "+t.v+" at position "+(open.pos+1)+" is never closed",peek());
          fail("Expected ',' or ')' in the arguments of "+t.v+" but found "+show(peek()));
        }
        next();
        return {t:'call',name:t.v.toUpperCase(),raw:t.v,args:args,pos:t.pos,end:t.end};
      }
      if(peek().type==='br'){const b=next();return {t:'col',table:t.v,col:b.v,pos:t.pos,end:b.end};}
      if(t.type==='qid')return {t:'id',name:t.v,pos:t.pos,end:t.end};
      const u=t.v.toUpperCase();
      if(u==='TRUE')return {t:'bool',v:true,pos:t.pos};
      if(u==='FALSE')return {t:'bool',v:false,pos:t.pos};
      if(u==='RETURN'||u==='VAR')fail("'"+t.v+"' is not expected here",t);
      return {t:'id',name:t.v,pos:t.pos,end:t.end};
    }
    if(t.type==='eof')fail('The formula ends too early - an expression is missing here',t);
    fail('Unexpected '+show(t)+' - an expression (a number, column or function) was expected',t);
  }
  const ast=parseExpr();
  if(peek().type!=='eof'){
    const t=peek();
    if(t.type==='op'&&t.v===')')fail("Unexpected ')' - there is no matching '(' for it",t);
    fail('Unexpected '+show(t)+" - did you forget an operator or a comma before it?",t);
  }
  return ast;
}
const parseCache=new Map();
function parseCached(src){
  if(parseCache.has(src)){const c=parseCache.get(src);if(c.err)throw c.err;return c.ast;}
  try{const ast=parseFormula(src);parseCache.set(src,{ast:ast});return ast;}
  catch(e){if(e instanceof DaxError)parseCache.set(src,{err:e});throw e;}
}

/* =====================================================================
   4. Evaluator
   ===================================================================== */
let DB=null; // current dataset
const TABLE_LC={}; Object.keys(TABLES).forEach(t=>TABLE_LC[t.toLowerCase()]=t);
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function nearest(name,list){let best=null,bd=99;for(const x of list){const d=lev(name.toLowerCase(),x.toLowerCase());if(d<bd){bd=d;best=x;}}return bd<=Math.max(2,Math.floor(name.length/3))?best:null;}
function norm(v){return v==null?'\u0000null':(typeof v==='string'?v.toLowerCase():v);}
function inter(a,b){const o=new Set();for(const x of a)if(b.has(x))o.add(x);return o;}
function resolveTable(name,node){
  const t=TABLE_LC[name.toLowerCase()];

const LEVELS=['Beginner','Intermediate','Pro'];
const lst=(x,P)=>typeof x==='function'?x(P):(x||[]);
function chRef(ch,P){return ch.ref(P);}
function chAlts(ch,P){return lst(ch.alts,P);}
function chWrongs(ch,P){return lst(ch.wrongs,P);}

/* =====================================================================
   6. Pattern checks (AST predicates)
   ===================================================================== */
function walk(n,fn){
  if(!n||typeof n!=='object')return;
  fn(n);
  if(n.l)walk(n.l,fn);if(n.r)walk(n.r,fn);if(n.e)walk(n.e,fn);
  if(n.args)n.args.forEach(a=>walk(a,fn));
  if(n.items)n.items.forEach(a=>walk(a,fn));
  if(n.vars)n.vars.forEach(v=>walk(v.e,fn));
  if(n.body)walk(n.body,fn);
}
function countCols(n){const s=new Set();let calls=0;walk(n,x=>{if(x.t==='col')s.add((x.table+'['+x.col+']').toLowerCase());if(x.t==='call')calls++;});return {cols:s.size,calls:calls};}
const RULES={
  slash:{level:'Intermediate',kind:'warn',test(ast){let hit=false;walk(ast,n=>{if(n.t==='bin'&&n.op==='/')hit=true;});return hit;},
    msg:'`/` returns Infinity (or an error) when the denominator is 0.',fix:'Use DIVIDE(numerator, denominator) - it returns BLANK instead.'},
  unqual:{level:'Beginner',kind:'warn',test(ast){let hit=false;walk(ast,n=>{if(n.t==='mref')hit=true;});return hit;},
    msg:'A name in [brackets] with no table in front is read as a measure, not a column.',fix:'Write columns with their table: Shipment[Revenue].'},
  filterInCalc:{level:'Intermediate',kind:'info',test(ast){
      let hit=false;
      walk(ast,n=>{if(n.t==='call'&&n.name==='CALCULATE')n.args.slice(1).forEach(a=>{
        if(a.t==='call'&&a.name==='FILTER'&&a.args.length===2&&a.args[0].t==='id'){const c=countCols(a.args[1]);if(c.cols===1&&c.calls===0)hit=true;}});});
      return hit;},
    msg:'FILTER(table, simple condition) inside CALCULATE works, but it iterates the whole table and overrides more context than needed.',fix:'A plain column filter is shorter and faster: CALCULATE(..., Shipment[Mode] = "Ocean").'},
  avgRatio:{level:'Pro',kind:'warn',test(ast){let hit=false;walk(ast,n=>{if(n.t==='call'&&n.name==='AVERAGEX'&&n.args[1]){walk(n.args[1],m=>{if((m.t==='bin'&&m.op==='/')||(m.t==='call'&&m.name==='DIVIDE'))hit=true;});}});return hit;},
    msg:'AVERAGEX over a per-row ratio is an average of ratios; every shipment counts equally, whatever its size.',fix:'Build the ratio from totals: DIVIDE(SUM(numerator), SUM(denominator)).'},
  ffeScope:{level:'Pro',kind:'warn',test(ast){
      let scoped=false;
      walk(ast,n=>{if(n.t==='bin'&&['>','<>','>='].includes(n.op)&&n.l.t==='col'&&n.l.col.toLowerCase()==='ffe'&&n.r.t==='num')scoped=true;});
      return !scoped;},
    msg:'Nothing restricts the ratio to Ffe > 0. Air shipments have Revenue but Ffe = 0, so their revenue inflates the numerator while adding nothing to the denominator.',fix:'CALCULATE(DIVIDE(SUM(Shipment[Revenue]), SUM(Shipment[Ffe])), KEEPFILTERS(Shipment[Ffe] > 0)) - KEEPFILTERS intersects with any existing Ffe filter instead of replacing it.'},
  allTable:{level:'Intermediate',kind:'info',test(ast){let hit=false;walk(ast,n=>{if(n.t==='call'&&n.name==='ALL'&&n.args.length===1&&n.args[0].t==='id')hit=true;});return hit;},
    msg:'ALL(Shipment) clears every filter on Shipment, more than this question needs.',fix:'ALL(Shipment[Mode]) clears only the Mode filter, which is what a share-of-all-modes denominator wants.'},
  sumxRedundant:{level:'Beginner',kind:'info',test(ast){let hit=false;walk(ast,n=>{if(n.t==='call'&&n.name==='SUMX'&&n.args.length===2&&n.args[0].t==='id'&&n.args[1].t==='col'&&n.args[0].name.toLowerCase()===n.args[1].table.toLowerCase())hit=true;});return hit;},
    msg:'SUMX(Shipment, Shipment[Column]) works, but it is just a longer SUM(Shipment[Column]).',fix:'Use SUM(Shipment[Column]) when you only add up a single column; keep SUMX for row-by-row calculations.'}
};
function runChecks(ch,ast){
  const out=[];
  if(!ast)return out;
  for(const id of ch.checks){const r=RULES[id];if(r&&r.test(ast))out.push({rule:id,level:r.level,kind:r.kind,msg:r.msg,fix:r.fix});}
  return out;
}

/* =====================================================================
   7. Grading
   ===================================================================== */
function contextsFor(ch){
  const [T,col]=ch.by.replace(']','').split('[');
  const vals=allValues(T,col).slice().sort((a,b)=>String(a).localeCompare(String(b)));
  const list=[{label:'Grand total',filters:[]}];
  for(const v of vals)list.push({label:ch.by+' = '+v,filters:[{col:ch.by,vals:[v]}]});
  return list;
}
function sameVal(a,b,tol){
  if(a==null&&b==null)return true;
  if(a==null)a=0;if(b==null)b=0;   // BLANK and 0 are treated as equal when grading
  if(typeof a==='number'&&typeof b==='number'){
    if(a===b)return true;
    if(!Number.isFinite(a)||!Number.isFinite(b))return false;
    return Math.abs(a-b)<=tol*Math.max(1,Math.abs(a),Math.abs(b));
  }
  return a===b;
}
function normCode(s){return s.replace(/\/\/.*$/gm,'').replace(/--.*$/gm,'').replace(/^\s*[A-Za-z_][A-Za-z0-9_ ]*=\s*(?!=)/,'').replace(/\s+/g,'').toLowerCase();}
// returns {status:'parse'|'runtime'|'ok'|'wrong', error, rows, warnings}
function grade(ch,code,P){
  let ast=null;
  try{ast=parseCached(code);}
  catch(e){if(e instanceof DaxError)return {status:'parse',error:e,rows:[],warnings:[]};throw e;}
  const warnings=runChecks(ch,ast);
  const ref=chRef(ch,P),tol=ch.tolerance||1e-6;
  const rows=[];let err=null;
  for(const c of contextsFor(ch)){
    const exp=evalMeasure(ref,c.filters);
    let got=null,bad=false;
    try{got=evalMeasure(code,c.filters);}catch(e){if(e instanceof DaxError){err=err||e;bad=true;}else throw e;}
    rows.push({label:c.label,user:got,exp:exp,match:!bad&&sameVal(got,exp,tol),err:bad});
  }
  if(err)return {status:'runtime',error:err,rows:rows,warnings:warnings};
  return {status:rows.every(r=>r.match)?'ok':'wrong',rows:rows,warnings:warnings};
}

function renderAll(){
  renderLevels();renderPicker();renderPrompt();
  state.attempted=false;state.hinted=false;updateAnswerBtn();
  $('editor').value='';$('result').hidden=true;$('result').innerHTML='';
}
function updateAnswerBtn(){$('answer').disabled=!(state.attempted||state.hinted);}
function snippet(code,e){
  if(e.pos==null||e.pos<0||e.pos>code.length)return '<pre>'+esc(code)+'</pre>';
  const a=Math.min(e.pos,code.length),b=Math.min(code.length,a+Math.max(1,e.len||1));
  return '<pre>'+esc(code.slice(0,a))+'<mark>'+esc(code.slice(a,b)||' ')+'</mark>'+esc(code.slice(b))+'</pre>';
}
function renderResult(ch,code,res){
  let h='';
  if(res.status==='parse'||res.status==='runtime'){
    h+='<div class="banner bad">&#10060; '+(res.status==='parse'?'This formula cannot be parsed':'This formula raised an error when evaluated')+'</div>';
    h+='<p>'+esc(res.error.message)+'</p>'+snippet(code,res.error);
    if(res.status==='runtime')h+=tableHtml(res.rows,true);
  }else{
    const nb=res.rows.filter(r=>!r.match).length;
    if(res.status==='ok'){
      h+='<div class="banner ok">&#9989; Correct - your measure matches the reference in all '+res.rows.length+' contexts.</div>';
      h+='<p>'+esc(ch.why)+'</p>';
      if(normCode(code)!==normCode(chRef(ch,state.D.params)))h+='<details><summary>Another way to write it</summary><pre>'+esc(chRef(ch,state.D.params))+'</pre></details>';
      h+='<details><summary>Results by context</summary>'+tableHtml(res.rows)+'</details>';
    }else{
      h+='<div class="banner bad">&#10060; Not quite - your measure differs from the reference in '+nb+' of '+res.rows.length+' contexts.</div>';
      h+=tableHtml(res.rows);
      h+='<p><strong>Why:</strong> '+esc(ch.why)+'</p>';
    }
  }
  if(res.warnings.length){
    h+=res.warnings.map(w=>'<div class="note '+(w.kind==='warn'?'warn':'info')+'">'+(w.kind==='warn'?'&#9888; ':'&#8505; ')+'<b class="tag">'+w.level+'</b>'+esc(w.msg)+' <em>'+esc(w.fix)+'</em></div>').join('');
  }
  const box=$('result');box.innerHTML=h;box.hidden=false;
}
function tableHtml(rows,showErr){
  return '<div class="scroll"><table><thead><tr><th>Context</th><th>Your result</th><th>Expected</th></tr></thead><tbody>'+
    rows.map(r=>'<tr class="'+(r.match?'':'miss')+'"><td>'+esc(r.label)+'</td><td class="num">'+(r.err?'error':esc(fmt(r.user)))+'</td><td class="num">'+esc(fmt(r.exp))+'</td></tr>').join('')+'</tbody></table></div>';
}
function doCheck(){
  const code=$('editor').value;
  if(!code.trim()){renderResult(current(),code,{status:'parse',error:new DaxError('Type a DAX measure first, for example SUM(Shipment[Revenue]).',0,1),rows:[],warnings:[]});return;}
  const ch=current();
  const res=grade(ch,code,state.D.params);
  state.attempted=true;updateAnswerBtn();
  renderResult(ch,code,res);
  if(res.status==='ok'){state.saved.solved[ch.id]=true;persist();renderPicker();}
}
function bind(){
  $('check').addEventListener('click',doCheck);
  $('editor').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();doCheck();}});
  $('hint').addEventListener('click',()=>{state.hinted=true;updateAnswerBtn();$('hintBox').innerHTML='<div class="note info"><b class="tag">Hint</b>'+esc(current().hint)+'</div>';});
  $('answer').addEventListener('click',()=>{const ch=current();$('answerBox').innerHTML='<div class="note info"><b class="tag">Answer</b><pre>'+esc(chRef(ch,state.D.params))+'</pre>'+esc(ch.why)+'</div>';});
  $('prev').addEventListener('click',()=>{if(state.idx>0){state.idx--;renderAll();persist();}});
  $('next').addEventListener('click',()=>{if(state.idx<levelList().length-1){state.idx++;renderAll();persist();}});
  $('picker').addEventListener('change',()=>{state.idx=parseInt($('picker').value,10)||0;renderAll();persist();});
  $('newdata').addEventListener('click',()=>{
    let s=Math.floor(Math.random()*100000);if(s===state.seed)s++;
    setData(s);renderPrompt();state.attempted=false;state.hinted=false;updateAnswerBtn();$('result').hidden=true;persist();
  });
  $('seed').addEventListener('change',()=>{
    const s=parseInt($('seed').value,10);if(!(s>=0))return;
    setData(s);renderPrompt();$('result').hidden=true;persist();
  });
}

/* =====================================================================
   9. Self-test  (open with ?selftest  or  ?selftest&seed=N)
   ===================================================================== */
function runSelfTest(seed){
  const lines=[];let pass=0,total=0;
  const log=(ok,msg)=>{total++;if(ok)pass++;const l=(ok?'PASS ':'FAIL ')+msg;lines.push(l);console.log(l);};
  const D=generateData(seed);DB=D;const P=D.params;
  console.log('seed='+seed+' attempt='+D.attempt+' params='+JSON.stringify(P));
  for(const ch of CHALLENGES){
    const ref=chRef(ch,P);
    let r=grade(ch,ref,P);
    log(r.status==='ok','ref   '+ch.id+' '+ch.title+(r.status==='ok'?'':' -> '+r.status+(r.error?' '+r.error.message:'')));
    for(const a of chAlts(ch,P)){
      r=grade(ch,a.code,P);
      let ok=r.status==='ok';
      if(ok&&a.warn)ok=r.warnings.some(w=>w.rule===a.warn);
      log(ok,'alt   '+ch.id+' '+(a.warn?'[expects warn '+a.warn+'] ':'')+a.code.replace(/\s+/g,' ').slice(0,70)+(ok?'':' -> '+r.status+(r.error?' '+r.error.message:'')));
    }
    for(const w of chWrongs(ch,P)){
      r=grade(ch,w.code,P);
      let ok=r.status==='wrong';
      if(ok&&w.warn)ok=r.warnings.some(x=>x.rule===w.warn);
      log(ok,'wrong '+ch.id+' '+(w.warn?'[expects warn '+w.warn+'] ':'')+w.code.replace(/\s+/g,' ').slice(0,70)+(ok?'':' -> '+r.status+(r.error?' '+r.error.message:'')));
    }
  }
  // ---- engine tests against independent JS computations ----
  const S=D.Shipment,C=D.Customer;
  const sum=(a,f)=>a.reduce((x,s)=>x+f(s),0);
  const seg={};C.forEach(c=>seg[c.CustomerKey]=c.Segment);
  const dateOf={};D.Date.forEach(d=>dateOf[d.DateKey]=d);
  const eq=(a,b)=>a===b||(a==null&&b==null)||(typeof a==='number'&&typeof b==='number'&&Math.abs(a-b)<1e-9*Math.max(1,Math.abs(b)));
  const T=(name,code,expected,filters)=>{
    let got,ok;
    try{got=evalMeasure(code,filters);ok=eq(got,expected);}catch(e){got='ERR '+e.message;ok=false;}
    log(ok,'engine '+name+' got='+(typeof got==='number'?got:JSON.stringify(got))+' expected='+JSON.stringify(expected));
  };
  const TE=(name,code,frag)=>{
    let msg='(no error)';try{evalMeasure(code);}catch(e){msg=e.message;}
    log(msg.toLowerCase().includes(frag.toLowerCase()),'engine error: '+name+' -> '+msg.slice(0,80));
  };
  const totalRev=sum(S,s=>s.Revenue);
  T('date year filter propagates','CALCULATE(SUM(Shipment[Revenue]), Date[Year] = 2026)',sum(S.filter(s=>dateOf[s.DateKey].Year===2026),s=>s.Revenue));
  T('date year+month (two filters)','CALCULATE(COUNTROWS(Shipment), Date[Year] = 2025, Date[Month] <= 6)',S.filter(s=>dateOf[s.DateKey].Year===2025&&dateOf[s.DateKey].Month<=6).length);
  T('context transition over Customer rows','SUMX(Customer, CALCULATE(SUM(Shipment[Revenue])))',totalRev);
  T('no transition without CALCULATE','SUMX(Customer, SUM(Shipment[Revenue]))',totalRev*C.length);
  T('transition over VALUES(col)','SUMX(VALUES(Shipment[Mode]), CALCULATE(SUM(Shipment[Revenue])))',totalRev);
  T('transition per Shipment row','SUMX(Shipment, CALCULATE(COUNTROWS(Shipment)))',S.length);
  T('ALL(Shipment) under Mode filter','CALCULATE(SUM(Shipment[Revenue]), ALL(Shipment))',totalRev,[{col:'Shipment[Mode]',vals:['Ocean']}]);
  T('ALL(col) removes only that column','CALCULATE(SUM(Shipment[Revenue]), ALL(Shipment[Mode]))',sum(S.filter(s=>s.Region==='Asia'),s=>s.Revenue),[{col:'Shipment[Mode]',vals:['Ocean']},{col:'Shipment[Region]',vals:['Asia']}]);
  T('boolean filter replaces column filter','CALCULATE(SUM(Shipment[Revenue]), Shipment[Mode] = "Air")',sum(S.filter(s=>s.Mode==='Air'),s=>s.Revenue),[{col:'Shipment[Mode]',vals:['Ocean']}]);
  T('KEEPFILTERS intersects (disjoint -> blank)','CALCULATE(SUM(Shipment[Revenue]), KEEPFILTERS(Shipment[Mode] = "Air"))',null,[{col:'Shipment[Mode]',vals:['Ocean']}]);
  T('KEEPFILTERS intersects (overlap)','CALCULATE(COUNTROWS(Shipment), KEEPFILTERS(Shipment[Mode] IN {"Ocean","Air"}))',S.filter(s=>s.Mode==='Ocean').length,[{col:'Shipment[Mode]',vals:['Ocean']}]);
  T('two filters on one column intersect','CALCULATE(COUNTROWS(Shipment), Shipment[Revenue] > 2000, Shipment[Revenue] < 5000)',S.filter(s=>s.Revenue>2000&&s.Revenue<5000).length);
  T('&& splits into separate column filters','CALCULATE(COUNTROWS(Shipment), Shipment[Mode] = "Ocean" && Shipment[Region] = "Asia")',S.filter(s=>s.Mode==='Ocean'&&s.Region==='Asia').length);
  T('IN list filter','CALCULATE(COUNTROWS(Shipment), Shipment[Mode] IN {"Ocean","Road"})',S.filter(s=>s.Mode!=='Air').length);
  T('Customer filter propagates to Shipment','CALCULATE(COUNTROWS(Shipment), Customer[Segment] = "Key")',S.filter(s=>seg[s.CustomerKey]==='Key').length);
  T('Shipment filter does not filter Customer','COUNTROWS(Customer)',C.length,[{col:'Shipment[Mode]',vals:['Air']}]);
  T('VALUES reflects Shipment filter',"COUNTROWS(VALUES(Shipment[CustomerKey]))",new Set(S.filter(s=>s.Mode==='Air').map(s=>s.CustomerKey)).size,[{col:'Shipment[Mode]',vals:['Air']}]);
  T('FILTER(ALL(col)) as CALCULATE filter','CALCULATE(COUNTROWS(Shipment), FILTER(ALL(Shipment[Mode]), Shipment[Mode] <> "Air"))',S.filter(s=>s.Mode!=='Air').length);
  T('RELATED in iterator','SUMX(Shipment, IF(RELATED(Customer[Segment]) = "Key", Shipment[Revenue], 0))',sum(S.filter(s=>seg[s.CustomerKey]==='Key'),s=>s.Revenue));
  T('case-insensitive text compare','CALCULATE(COUNTROWS(Shipment), Shipment[Mode] = "oCeAn")',S.filter(s=>s.Mode==='Ocean').length);
  T('measure-name prefix is stripped','Total Revenue = SUM(Shipment[Revenue])',totalRev);
  T('VAR / RETURN','VAR a = SUM(Shipment[Revenue])\nVAR b = COUNTROWS(Shipment)\nRETURN DIVIDE(a, b)',totalRev/S.length);
  T('VAR is not re-evaluated by CALCULATE','VAR a = SUM(Shipment[Revenue]) RETURN CALCULATE(a, Shipment[Mode] = "Air")',totalRev);
  T('comments are ignored','// c1\nSUM(Shipment[Revenue]) -- c2\n/* c3 */',totalRev);
  T('DIVIDE by zero is blank','DIVIDE(1, 0)',null);
  T('DIVIDE alternate result','DIVIDE(1, 0, -1)',-1);
  T('/ by zero is Infinity','1 / 0',Infinity);
  T('MAXX / MINX over rows','MAXX(Shipment, Shipment[Revenue]) - MINX(Shipment, Shipment[Revenue])',Math.max(...S.map(s=>s.Revenue))-Math.min(...S.map(s=>s.Revenue)));
  T('SUM of no rows is blank','CALCULATE(SUM(Shipment[Revenue]), Shipment[Mode] = "Nope")',null);
  TE('naked column','Shipment[Revenue]','aggregation');
  TE('unknown function','SUMM(Shipment[Revenue])','Did you mean SUM');
  TE('unknown column','SUM(Shipment[Revenu])','Did you mean Shipment[Revenue]');
  TE('unknown table','SUM(Shipments[Revenue])','Did you mean Shipment');
  TE('unbalanced paren','SUM(Shipment[Revenue]',"Missing ')'");
  TE('extra paren','SUM(Shipment[Revenue]))','no matching');
  TE('unqualified column','SUM([Revenue])','Shipment[Revenue]');
  TE('RELATED outside row context','RELATED(Customer[Segment])','row context');
  TE('== is rejected','CALCULATE(SUM(Shipment[Revenue]), Shipment[Mode] == "Air")','single =');
  TE('function in boolean filter','CALCULATE(SUM(Shipment[Revenue]), Shipment[Revenue] > AVERAGE(Shipment[Revenue]))','FILTER');
  const out=(pass===total?'SELFTEST PASS ':'SELFTEST FAIL ')+pass+'/'+total+' (seed '+seed+')';
  lines.push(out);
  console.log(out);
  window.__selftest={pass:pass,total:total,lines:lines,ok:pass===total};
  return lines;
}

/* =====================================================================
   10. Boot
   ===================================================================== */
(function boot(){
  const q=new URLSearchParams(location.search);
  if(q.has('selftest')){
    document.body.classList.add('selftest');
    const seed=parseInt(q.get('seed'),10);
    let lines;
    try{lines=runSelfTest(Number.isFinite(seed)?seed:20260824);}
    catch(e){lines=['SELFTEST FAIL exception: '+e.message];console.log(lines[0]);window.__selftest={ok:false,pass:0,total:0,lines:lines};}
    $('selftest-out').textContent=lines.join('\n');
    return;
  }
  const saved=lsLoad();
  state.saved.solved=saved.solved||{};
  if(LEVELS.includes(saved.level))state.level=saved.level;
  if(Number.isInteger(saved.idx)&&saved.idx>=0&&saved.idx<levelList().length)state.idx=saved.idx;
  const qs=parseInt(q.get('seed'),10);
  const seed=Number.isFinite(qs)?qs:(Number.isInteger(saved.seed)?saved.seed:Math.floor(Math.random()*100000));
  setData(seed);
  bind();renderAll();
})();
</script>
