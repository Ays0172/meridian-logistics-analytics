# Meridian Global Logistics -- scale dial
#
# Implements SCHEMA_CONTRACT.md SS0 "Scale dial". `prod` is the default.
#
# REVISION R2: history extended from 3.67 years (2023-01-01..2026-08-31) to a
# full 5 years (2021-08-21..2026-08-20, ending yesterday so the live feed can
# append from today). Every fact row count was scaled by 1.3636 to hold DAILY
# intensity constant -- the dataset is longer, not denser. DimVoyage rose from
# 6,800 to 9,270 because five years of weekly loops need more voyages, and
# DimDate from 1,461 to 2,191 rows.
#
# Dimension row counts do not vary with `scale`.
